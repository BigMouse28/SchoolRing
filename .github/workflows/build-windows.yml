name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build bundle Windows
        run: .\gradlew.bat packageWindowsZip
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolRing-windows
          path: app/build/package/SchoolRing-windows-x64.zip