plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation libs.guava
    implementation libs.sqlite.jdbc
}

javafx {
    version = '22.0.1'
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media' ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    applicationName = 'SchoolRing'
    mainClass = 'com.hafidzubaidillah.SchoolRing.App'
}

tasks.register('packageWindows', Exec) {
    group = 'distribution'
    description = 'Build a portable Windows app bundle with a bundled Java runtime.'
    dependsOn tasks.named('installDist')

    def packageDirectory = layout.buildDirectory.dir('package/windows')
    def inputDirectory = layout.buildDirectory.dir('install/SchoolRing/lib')
    def jpackageExecutable = file("${System.getProperty('java.home')}/bin/jpackage.exe")

    doFirst {
        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            throw new GradleException('The Windows application bundle must be built on Windows.')
        }
        if (!jpackageExecutable.file) {
            throw new GradleException("jpackage was not found at ${jpackageExecutable}. Run this task with a full JDK.")
        }
        delete packageDirectory
        packageDirectory.get().asFile.mkdirs()
    }

    inputs.dir(inputDirectory)
    outputs.dir(packageDirectory)

    commandLine jpackageExecutable,
        '--type', 'app-image',
        '--name', 'SchoolRing',
        '--app-version', '1.0.0',
        '--vendor', 'SchoolRing',
        '--description', 'Bel Sekolah Otomatis',
        '--input', inputDirectory.get().asFile,
        '--main-jar', 'app.jar',
        '--main-class', 'com.hafidzubaidillah.SchoolRing.App',
        '--dest', packageDirectory.get().asFile
}

tasks.register('packageWindowsZip', Zip) {
    group = 'distribution'
    description = 'Create a ZIP of the portable Windows app bundle.'
    dependsOn tasks.named('packageWindows')
    archiveFileName = 'SchoolRing-windows-x64.zip'
    destinationDirectory = layout.buildDirectory.dir('package')
    from(layout.buildDirectory.dir('package/windows/SchoolRing'))
}

tasks.named('test') {
    useJUnitPlatform()
}
